# 本檔刻意放在 k8s/examples/：避免 `kubectl apply -f k8s/` 把佔位值當成真實 Secret 套用。不得直接 apply，須先複製成 k8s/secret.yaml 並替換佔位值。
# Secret 範本：只含佔位值。使用方式：
#   cp k8s/examples/secret.example.yaml k8s/secret.yaml   （secret.yaml 已列入 .gitignore，不進版控）
#   編輯 k8s/secret.yaml，把所有 REPLACE_ME_* 換成自己產生的隨機值（只用英數字，避免 ; = $( 破壞連線字串）
#   kubectl apply -f k8s/secret.yaml
# 連線字串內的密碼必須與 POSTGRES_PASSWORD 一致，Database／Username 必須與 ConfigMap 的
# POSTGRES_DB／POSTGRES_USER 一致。兩個簽章金鑰至少 32 字元（api 啟動時驗證）。
# AdminBootstrap__Password 佔位值刻意不符合密碼強度規則（無數字），未替換就部署會在啟動驗證失敗；須替換為至少 8 字元且含英文字母與數字的強密碼。首位 Admin 建立後應連同 ConfigMap 的 AdminBootstrap__Email 一併移除（只移除此鍵會因「只設定其一」使 api 啟動失敗；不做密碼輪替）。
apiVersion: v1
kind: Secret
metadata:
  name: projectc-secrets
  namespace: projectc
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME_POSTGRES_PASSWORD"
  ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=projectc;Username=projectc;Password=REPLACE_ME_POSTGRES_PASSWORD"
  Jwt__SigningKey: "REPLACE_ME_RANDOM_AT_LEAST_32_CHARS_JWT"
  TicketSigning__SigningKey: "REPLACE_ME_RANDOM_AT_LEAST_32_CHARS_TICKET"
  AdminBootstrap__Password: "CHANGE-ME-REQUIRED"
