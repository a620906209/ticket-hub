# 一般（非機敏）設定。機敏值一律放 Secret（見 examples/secret.example.yaml），不得寫進這個檔案。
apiVersion: v1
kind: ConfigMap
metadata:
  name: projectc-config
  namespace: projectc
data:
  # Production：不啟用 OpenAPI／SwaggerUI、不執行展示用 seeder；首位 Admin 由 AdminBootstrap 建立（Password 在 Secret）。
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  # 付款與 Email 目前仍是 Mock；Production 預設拒絕以 Mock 啟動，這個旗標明示放行。僅限本機驗證／展示，不得用於收費環境。
  Mocks__AllowInProduction: "true"
  Jwt__Issuer: "ProjectC.WebApi"
  Jwt__Audience: "ProjectC.Client"
  Jwt__AccessTokenExpirationMinutes: "30"
  Auth__RefreshTokenExpirationDays: "14"
  Auth__PasswordResetTokenExpirationMinutes: "15"
  # 連線池上限：(API 副本數 2 + 滾動更新 surge 1) × 25 + 3 個 superuser 保留連線 = 78 ≤ PostgreSQL max_connections 100。調整副本數時須重算（docs/todo/2026-11-02-deployment-prerequisites.md「資料庫連線池容量」）；25 為估算值，未經 k6 實測。
  Database__MaxPoolSize: "25"
  Seq__ServerUrl: "http://seq:5341"
  ConnectionStrings__Redis: "redis:6379"
  AdminBootstrap__Email: "admin@local.dev"
  POSTGRES_USER: "projectc"
  POSTGRES_DB: "projectc"
