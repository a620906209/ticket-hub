# 一般（非機敏）設定。機敏值一律放 Secret（見 examples/secret.example.yaml），不得寫進這個檔案。
apiVersion: v1
kind: ConfigMap
metadata:
  name: projectc-config
  namespace: projectc
data:
  # Production：不啟用 OpenAPI／SwaggerUI、不執行展示用 seeder；首位 Admin 由 AdminBootstrap 建立（Password 在 Secret）。
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  Jwt__Issuer: "ProjectC.WebApi"
  Jwt__Audience: "ProjectC.Client"
  Jwt__AccessTokenExpirationMinutes: "30"
  Auth__RefreshTokenExpirationDays: "14"
  Auth__PasswordResetTokenExpirationMinutes: "15"
  Seq__ServerUrl: "http://seq:5341"
  ConnectionStrings__Redis: "redis:6379"
  AdminBootstrap__Email: "admin@local.dev"
  POSTGRES_USER: "projectc"
  POSTGRES_DB: "projectc"
