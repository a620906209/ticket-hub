name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # 只取消 PR 的舊執行；master 每次 push 都跑完，README 徽章才不會顯示 cancelled。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (xUnit + Testcontainers)
    # 固定版本而非 ubuntu-latest：latest 自 2026-10-19 起改指 Ubuntu 26，runner 環境差異曾讓測試失敗，
    # 升級改為主動進行並確認 CI 通過。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 本機開發一律在 compose 容器內執行 dotnet（CLAUDE.md 執行環境規則），理由是避免連到錯誤的 DB
      # 或把 bin/obj 寫進 bind mount；CI runner 是乾淨的一次性環境，沒有這兩個問題，直接安裝 SDK。
      # 版本與 Dockerfile 的 mcr.microsoft.com/dotnet/sdk:10.0 一致。
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ProjectC.slnx

      # 不設定 Testcontainers__ComposeNetworkName：各 fixture 在未設定時改用 mapped port 連線，
      # runner 直接使用主機 Docker，不需要 compose 網路與 DooD 設定。
      # 以 root 執行：本機測試在 api 容器內即為 root，LoadTest.Seeder 會把 token 檔 chown 給 k6 使用者，
      # 非 root 會失敗；runner 預設使用者為非 root 的 runner。sudo 會重設 PATH，所以以 env 帶入
      # setup-dotnet 設定的 PATH，-E 保留 DOTNET_ROOT 等環境變數。
      - name: Test
        run: sudo -E env "PATH=$PATH" dotnet test ProjectC.slnx --no-restore

  openspec:
    name: OpenSpec validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 版本與本機 openspec CLI 一致。不加 --strict：既有主 spec 多條 Requirement 超過長度建議，
      # strict 模式會全數失敗。非 strict 只擋結構錯誤（例如缺 Requirements 段落），Scenario 標題寫錯不會失敗。
      - run: npx --yes @fission-ai/openspec@1.14.1 validate --all --no-interactive

  frontend:
    name: Frontend (lint + Vitest + build)
    # 理由同 backend。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # 版本與 web/Dockerfile 的 node:22-alpine 一致。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # build 包含 vue-tsc 型別檢查。
      - run: npm run build
