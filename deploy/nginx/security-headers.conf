# 每個 location 都必須 include 本檔：nginx 只要某個 location 自己有 add_header，就不繼承 server／http 層的 add_header
# （edge-security-headers design.md 決策 1）。映像內路徑 /etc/nginx/snippets/，不可放 conf.d/（會被當 http 層設定載入）。
# $hsts_value 由 default.conf 的 map 依入站 X-Forwarded-Proto 決定；空值時 nginx 不輸出該標頭。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security $hsts_value always;
