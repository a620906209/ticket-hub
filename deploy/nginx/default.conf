# nginx 只聽 HTTP，$scheme 恆為 http；TLS 由前方代理終結，改以其送來的 X-Forwarded-Proto 判斷。
# 非 https（含缺省、"https, http" 這類附加值）一律不送 HSTS，屬 fail-safe（edge-security-headers design.md 決策 3）。
map $http_x_forwarded_proto $hsts_value {
    default "";
    https "max-age=15552000";
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
# text/html 為預設類型；JS 的 Content-Type 依映像的 mime.types 為 application/javascript 或 text/javascript，兩者都列。
gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # 上游主機名 `api` 沿用 compose／日後 K8s Service 名稱；nginx 啟動時解析不到會直接退出。
    # client_max_body_size 取 10m：等於 API 單端點最大上限 RequestBodyLimits.CreateSeatMapBytes
    # （10,485,760 bytes）；nginx 預設 1m 會以 413 擋掉座位圖建立。實際的 1 MiB 全域與各端點上限仍由 API 負責。
    location /api/ {
        client_max_body_size 10m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # 覆蓋而非附加用戶端自帶的 X-Forwarded-For：API 信任本代理，附加會讓外部用戶端偽造來源位址繞過限流
        # （reverse-proxy-forwarded-headers design.md 決策 3）。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite 產出的檔名帶 hash，可長期快取。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
