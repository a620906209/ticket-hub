services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 對外 port 衝突時，在你自己的 .env 設 DB_HOST_PORT 就好，不用改這個共用檔案。
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  seq:
    # 釘選已驗證過的版本，避免未來 latest 更新後行為/設定要求（例如 SEQ_FIRSTRUN_* 環境變數）
    # 無預警改變（實測時就踩過新版強制要求指定驗證方式的變動，見下方環境變數註解）。
    image: datalust/seq:2026.1.17114
    environment:
      ACCEPT_EULA: "Y"
      # 新版 Seq image 第一次啟動時強制要求二選一：SEQ_FIRSTRUN_ADMINPASSWORD 或
      # SEQ_FIRSTRUN_NOAUTHENTICATION，否則直接啟動失敗（實測發現，非文件假設）；本機展示情境
      # 不需要帳密驗證，比照 design.md 決策（不新增 Seq 帳號密碼驗證）明確選擇後者。
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    ports:
      # Web 查詢介面；對外 port 衝突時，在你自己的 .env 設 SEQ_HOST_PORT 就好，不用改這個共用檔案。
      # 綁定方式比照 db/api/web，不額外限制僅本機存取（本機開發展示情境，非公開部署，
      # 見 observability spec.md「Seq 作為本機 Docker Compose 集中查詢平台」的存取權限範圍段落）。
      - "${SEQ_HOST_PORT:-8081}:80"
      # ingestion port（5341）刻意不對外映射，只有 api 透過 compose 網路內部連線寫入，
      # 沒有從瀏覽器直接存取的需求，縮小對外暴露面（design.md 決策 5）。
    # 不掛載 named volume：本機展示/開發用途，容器重建後歷史日誌清空即可，不需要跨重建保留
    # （design.md 決策 6）。

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # api 依賴 db 先通過健康檢查（真正接受連線）才啟動，避免啟動時連線失敗；
    # seq 不要求健康檢查通過才啟動 api——Seq sink 連線失敗不得阻塞應用程式啟動或請求處理
    # （observability spec.md「Seq sink 連線失敗不得影響應用程式啟動或請求處理」），depends_on 只是
    # 確保啟動順序、讓 seq 有機會先跑起來，不是 api 啟動的必要條件。
    depends_on:
      db:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      # 連線字串一律用 compose service name `db`，容器內不可用 localhost/127.0.0.1。
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__AccessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
      Auth__RefreshTokenExpirationDays: ${AUTH_REFRESH_TOKEN_EXPIRATION_DAYS}
      Auth__PasswordResetTokenExpirationMinutes: ${AUTH_PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES}
      TicketSigning__SigningKey: ${TICKET_SIGNING_KEY}
      # compose service name（非 localhost），純量設定鍵（非 Serilog:WriteTo 陣列），見 observability
      # design.md 決策 1 附錄的實作修正——appsettings.json 預設空值不啟用 Seq sink，這裡才是真正的位址來源。
      Seq__ServerUrl: http://seq:5341
      # 讓容器內的 Testcontainers 整合測試知道要把臨時容器加進哪個 compose 網路，
      # 才能跟 api 自己互連；固定寫死是因為下面 networks.default.name 也固定為同一個值。
      Testcontainers__ComposeNetworkName: projectc_default
      # Ryuk（Testcontainers 自動回收孤兒容器的機制）是獨立容器，不受上面的網路設定影響，
      # 在 DooD（容器內操作 host Docker）情境下一樣連不到，官方對此情境的建議做法是停用；
      # 測試程式碼本身已在 DisposeAsync() 正確清理容器，只有測試行程被強制中斷才會留下孤兒容器。
      TESTCONTAINERS_RYUK_DISABLED: "true"
    ports:
      # 對外 port 衝突時，在你自己的 .env 設 API_HOST_PORT 就好，不用改這個共用檔案。
      - "${API_HOST_PORT:-8080}:8080"
    volumes:
      # 開發時掛載完整原始碼，支援 dotnet watch hot reload。
      - .:/src
      # 掛 host 的 docker.sock，讓容器內的 Testcontainers 整合測試能操作 host 的 Docker daemon（Docker-out-of-Docker）。
      # 注意：這等同把 host 的完整 Docker 控制權交給容器，僅限本機開發環境使用。
      - /var/run/docker.sock:/var/run/docker.sock
      # NuGet 快取與各專案的 build 產出物改用 named volume，避免透過 bind mount 在 Windows 上讀寫，效能才不會很差。
      - nuget_packages:/root/.nuget/packages
      - domain_bin:/src/src/ProjectC.Domain/bin
      - domain_obj:/src/src/ProjectC.Domain/obj
      - application_bin:/src/src/ProjectC.Application/bin
      - application_obj:/src/src/ProjectC.Application/obj
      - infrastructure_bin:/src/src/ProjectC.Infrastructure/bin
      - infrastructure_obj:/src/src/ProjectC.Infrastructure/obj
      - webapi_bin:/src/src/ProjectC.WebApi/bin
      - webapi_obj:/src/src/ProjectC.WebApi/obj
      - domain_tests_bin:/src/tests/ProjectC.Domain.Tests/bin
      - domain_tests_obj:/src/tests/ProjectC.Domain.Tests/obj
      - application_tests_bin:/src/tests/ProjectC.Application.Tests/bin
      - application_tests_obj:/src/tests/ProjectC.Application.Tests/obj
      - webapi_tests_bin:/src/tests/ProjectC.WebApi.Tests/bin
      - webapi_tests_obj:/src/tests/ProjectC.WebApi.Tests/obj

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      # 對外 port 衝突時，在你自己的 .env 設 WEB_HOST_PORT 就好，不用改這個共用檔案。
      - "${WEB_HOST_PORT:-5173}:5173"
    volumes:
      # 開發時掛載完整原始碼，支援 Vite HMR。
      - ./web:/app
      # node_modules 用 named volume，避免透過 bind mount 在 Windows 上讀寫大量小檔案，效能才不會很差。
      - web_node_modules:/app/node_modules

networks:
  default:
    # 固定命名，不讓 checkout 目錄名稱影響網路名稱——api 容器內的 Testcontainers 整合測試
    # 需要用固定的網路名稱把臨時容器掛進來這裡，才能跟 api 互連。
    name: projectc_default

volumes:
  postgres_data:
  nuget_packages:
  domain_bin:
  domain_obj:
  application_bin:
  application_obj:
  infrastructure_bin:
  infrastructure_obj:
  webapi_bin:
  webapi_obj:
  domain_tests_bin:
  domain_tests_obj:
  application_tests_bin:
  application_tests_obj:
  webapi_tests_bin:
  webapi_tests_obj:
  web_node_modules:
